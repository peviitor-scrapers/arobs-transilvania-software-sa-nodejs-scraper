name: Deep Validate Jobs

on:
  workflow_dispatch:

jobs:
  deep-validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Deep validate (content mode — GET + body scan, catches soft-404s)
        run: node --no-deprecation tests/validate-company-jobs.js --content --timeout 30000 --delete
