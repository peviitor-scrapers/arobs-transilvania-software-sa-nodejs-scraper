name: Scrape

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (scrape + validate, no real writes)'
        type: boolean
        default: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          
      - name: Sync with remote
        if: github.event_name != 'pull_request'
        run: git pull origin main --rebase -X theirs

      - name: Install dependencies
        run: npm install

      - name: Ensure company exists in company core
        # Real write, so it must respect BOTH gates real writes need:
        #   - manageCompany (config/scraper.json) -- skip entirely once another
        #     scraper is verified to own this CIF's company record.
        #   - dry_run -- only a manual workflow_dispatch run can ask for it (default
        #     true in the UI); a schedule trigger has no `inputs` context at all
        #     (github.event.inputs.dry_run is "" there, not "false"), so it must
        #     fall through to a REAL run, same rule as the Python template's
        #     scrape.yml. This step used to run unconditionally on every trigger,
        #     ignoring both manageCompany and any notion of dry-run -- there was no
        #     dry-run concept anywhere in the JS scraper until this fix.
        if: "!(github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true')"
        run: |
          MANAGE_COMPANY=$(jq -r '.manageCompany' scraper/config/scraper.json)
          if [ "$MANAGE_COMPANY" != "true" ]; then
            echo "manageCompany=false in config/scraper.json -- skipping (another scraper owns this CIF's company record)"
            exit 0
          fi
          CIF=$(printf '%08d' "$(jq -r '.id' scraper/config/company.json)")
          LEGAL_NAME=$(jq -r '.company' scraper/config/company.json)
          BRAND=$(jq -r '.brand' scraper/config/company.json)
          WEBSITE=$(jq -r '.website[0]' scraper/config/company.json)
          CAREER=$(jq -r '.career[0]' scraper/config/company.json)
          DEFAULT_LOC=$(jq -r '.location[0]' scraper/config/company.json)
          SCRAPER_FILE=$(jq -r '.scraperFile' scraper/config/company.json)
          TODAY=$(date -u +%Y-%m-%d)

          echo "Upserting ${BRAND} (CIF: ${CIF}) via peviitor API..."
          jq -n \
            --arg id "$CIF" \
            --arg company "$LEGAL_NAME" \
            --arg brand "$BRAND" \
            --arg website "$WEBSITE" \
            --arg career "$CAREER" \
            --arg loc "$DEFAULT_LOC" \
            --arg today "$TODAY" \
            --arg scraperFile "$SCRAPER_FILE" \
            '{id:$id,company:$company,brand:$brand,status:"activ",location:[$loc],website:[$website],career:[$career],lastScraped:$today,scraperFile:$scraperFile}' \
            > company_data.json

          curl -s -X PUT \
            "https://api.peviitor.ro/v1/firme/company/add/" \
            -H "Content-Type: application/json" \
            --data-binary @company_data.json

          FINAL=0

          for ATTEMPT in 1 2 3 4 5 6; do

            FINAL=$(curl -s "https://api.peviitor.ro/v1/firme/company/?cif=${CIF}" | jq '.total // 0')

            [ "$FINAL" -ge 1 ] && break

            sleep 5

          done
          echo "${BRAND} count after upsert: $FINAL"

          if [ "$FINAL" -ge "1" ]; then
            echo "✅ SUCCESS: ${BRAND} is in company core"
          else
            echo "❌ FAILED: ${BRAND} still not in company core"
            exit 1
          fi

      - name: Pre-scrape — Unit Tests
        # Non-blocking: tests/unit/demoanaf.test.js makes live, unmocked calls
        # to demoanaf.ro (searchCompany). anaf.js itself already falls back to
        # cuifirma.ro when demoanaf.ro is down, but if BOTH providers are ever
        # down at once, this step must not be able to stop "Run scraper" below
        # -- that exact failure mode (a live external test dependency blocking
        # the whole pipeline for days) took down a fleet-adjacent scraper on
        # 2026-09-24. Test results are still generated and uploaded either way.
        continue-on-error: true
        run: |
          mkdir -p docs/test-results
          npm run test:unit
          COMPANY_NAME=$(jq -r '.company' scraper/config/company.json)
          sed -i "s|<title>Test Report</title>|<title>Pre-scrape: Unit Tests — ${COMPANY_NAME}</title>|;s|<h1 id=\"title\">Test Report</h1>|<h1 id=\"title\">Pre-scrape: Unit Tests — ${COMPANY_NAME}</h1>|" test-report.html
          cp test-report.html docs/test-results/pre-scrape-unit.html || true

      - name: Pre-scrape — Integration Tests
        # Same live demoanaf.ro/cuifirma.ro dependency as the unit suite above
        # (workflow.test.js also calls anaf.searchCompany) -- non-blocking for
        # the same reason.
        continue-on-error: true
        run: |
          mkdir -p docs/test-results
          npm run test:integration
          COMPANY_NAME=$(jq -r '.company' scraper/config/company.json)
          sed -i "s|<title>Test Report</title>|<title>Pre-scrape: Integration Tests — ${COMPANY_NAME}</title>|;s|<h1 id=\"title\">Test Report</h1>|<h1 id=\"title\">Pre-scrape: Integration Tests — ${COMPANY_NAME}</h1>|" test-report.html
          cp test-report.html docs/test-results/pre-scrape-integration.html || true

      - name: Run scraper
        # Same gating rule as the Python template: only a manual workflow_dispatch
        # run can ask for dry-run (default true in the UI, so an explicit "false"
        # is required to write for real from there). A scheduled run has no
        # `inputs` context at all -- github.event.inputs.dry_run is "" on a
        # `schedule` trigger, which must fall through to a REAL run.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.dry_run }}" != "false" ]; then
            npm run scrape:dry-run
          else
            npm run scrape
          fi
          
      - name: Check for new jobs
        run: |
          if [ -f scraper/jobs.json ]; then
            echo "New jobs found:"
            cat scraper/jobs.json | jq '.jobs | length'
          else
            echo "No new jobs or scrape failed"
          fi

      - name: Post-scrape — E2E Tests
        # Same live demoanaf.ro dependency (scraper.test.js calls searchCompany)
        # -- non-blocking so a broken external demo endpoint can't also skip
        # Consistency Tests below, after a scrape that already succeeded.
        continue-on-error: true
        run: |
          mkdir -p docs/test-results
          npm run test:e2e
          COMPANY_NAME=$(jq -r '.company' scraper/config/company.json)
          sed -i "s|<title>Test Report</title>|<title>Post-scrape: E2E Tests — ${COMPANY_NAME}</title>|;s|<h1 id=\"title\">Test Report</h1>|<h1 id=\"title\">Post-scrape: E2E Tests — ${COMPANY_NAME}</h1>|" test-report.html
          cp test-report.html docs/test-results/post-scrape.html || true

      - name: Consistency Tests
        run: |
          mkdir -p docs/test-results
          npm run test:consistency
          COMPANY_NAME=$(jq -r '.company' scraper/config/company.json)
          sed -i "s|<title>Test Report</title>|<title>Post-scrape: Consistency Tests — ${COMPANY_NAME}</title>|;s|<h1 id=\"title\">Test Report</h1>|<h1 id=\"title\">Post-scrape: Consistency Tests — ${COMPANY_NAME}</h1>|" test-report.html
          cp test-report.html docs/test-results/post-scrape-consistency.html || true
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate test-results index
        # docs/test-results/ only ever gets the 4 individual report files
        # (pre-scrape-unit.html, pre-scrape-integration.html, post-scrape.html,
        # post-scrape-consistency.html) -- there was never an index.html, so
        # GitHub Pages 404s on the directory itself and the "Rezultate Teste"
        # button on docs/index.html links to a dead page. Every scraper in the
        # fleet had this bug. Build a tiny index linking whichever reports
        # exist (continue-on-error above means some steps may not have run).
        if: always()
        run: |
          mkdir -p docs/test-results
          COMPANY_NAME=$(jq -r '.company' scraper/config/company.json 2>/dev/null || echo "Scraper")
          NAV_ITEMS=""
          add_nav() { if [ -f "docs/test-results/$1.html" ]; then NAV_ITEMS="${NAV_ITEMS}<a href=\"$1.html\" style=\"color:#9a9fac;text-decoration:none;margin-left:1rem\">$2</a>"; fi; }
          add_nav pre-scrape-unit "Unit"
          add_nav pre-scrape-integration "Integration"
          add_nav post-scrape "E2E"
          add_nav post-scrape-consistency "Consistency"
          NAVBAR="<div data-pv-navbar style=\"font-family:'JetBrains Mono',monospace;background:#131317;border-bottom:2px solid #e0122a;color:#9a9fac;padding:.6rem 1.1rem;font-size:.75rem;letter-spacing:.04em\"><a href=\"../\" style=\"color:#e0122a;text-decoration:none;font-weight:700\">&larr; DASHBOARD</a>${NAV_ITEMS}</div>"
          NAVBAR_ESC=$(printf '%s' "$NAVBAR" | sed 's/[&\]/\\&/g')
          for f in docs/test-results/*.html; do
            [ -f "$f" ] || continue
            case "$f" in */index.html) continue;; esac
            grep -q "data-pv-navbar" "$f" 2>/dev/null && continue
            sed -i "s|<body>|<body>${NAVBAR_ESC}|" "$f" || true
          done
          BASE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME:-main}"
          BASE_URL_ESC=$(printf '%s' "$BASE_URL" | sed 's/[&\]/\\&/g')
          for f in docs/test-results/*.html; do
            [ -f "$f" ] || continue
            case "$f" in */index.html) continue;; esac
            grep -q 'suite-path"><a ' "$f" 2>/dev/null && continue
            sed -i -E "s|<div class=\"suite-path\">${GITHUB_WORKSPACE}/([^<]*)</div>|<div class=\"suite-path\"><a href=\"${BASE_URL_ESC}/\1\" target=\"_blank\" rel=\"noopener\" style=\"color:inherit;text-decoration:underline\">\1</a></div>|g" "$f" || true
          done
          {
            echo "<!DOCTYPE html><html lang=\"ro\"><head><meta charset=\"UTF-8\">"
            echo "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">"
            echo "<title>Rezultate teste — ${COMPANY_NAME}</title>"
            echo "<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">"
            echo "<link href=\"https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=JetBrains+Mono:wght@400;500;700&display=swap\" rel=\"stylesheet\">"
            echo "<style>"
            echo ":root{--ink:#eceef1;--ink-dim:#9a9fac;--ink-faint:#5c616e;--bg:#0a0a0d;--surface:#131317;--surface2:#1a1a20;--border:#2a2a32;--red:#e0122a;}"
            echo "*{box-sizing:border-box;margin:0;padding:0}"
            echo "body{font-family:'JetBrains Mono',monospace;background:var(--bg);color:var(--ink);max-width:760px;margin:0 auto;padding:2rem 1.25rem 3rem;line-height:1.6}"
            echo "h1{font-family:'Oswald',sans-serif;color:var(--ink);text-transform:uppercase;letter-spacing:.03em;font-size:1.3rem;border-left:4px solid var(--red);padding-left:.7rem;margin-bottom:1.5rem}"
            echo "ul{list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1px;background:var(--border);border:1px solid var(--border)}"
            echo "li{background:var(--surface);padding:1rem 1.1rem;border-top:2px solid transparent;transition:.15s}"
            echo "li:hover{border-top-color:var(--red);background:var(--surface2)}"
            echo "a{color:var(--ink);text-decoration:none;font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.03em}"
            echo "a:hover{color:var(--red)}"
            echo ".missing{color:var(--ink-faint);font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.03em}"
            echo ".back{display:inline-block;margin-top:1.75rem;color:var(--ink-faint);text-decoration:none;font-size:.78rem;letter-spacing:.04em}"
            echo ".back:hover{color:var(--red)}"
            echo "</style>"
            echo "</head><body><h1>Rezultate teste — ${COMPANY_NAME}</h1><ul>"
            add_entry() {
              if [ -f "docs/test-results/$1.html" ]; then
                echo "<li><a href=\"$1.html\">$2</a></li>"
              else
                echo "<li class=\"missing\">$2 (nu a rulat încă)</li>"
              fi
            }
            add_entry pre-scrape-unit "Pre-scrape — Unit Tests"
            add_entry pre-scrape-integration "Pre-scrape — Integration Tests"
            add_entry post-scrape "Post-scrape — E2E Tests"
            add_entry post-scrape-consistency "Post-scrape — Consistency Tests"
            echo "</ul><a class=\"back\" href=\"../\">&larr; ÎNAPOI LA DASHBOARD</a></body></html>"
          } > docs/test-results/index.html

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: docs/test-results/
          retention-days: 30

      - name: Push test results to docs/
        if: always()
        run: |
          mkdir -p docs/test-results
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/test-results/ || true
          git add docs/jobs.md || true
          git commit -m "[skip ci] Update test results" || echo "No changes to commit"
          git push || echo "Push failed (race condition) — will be picked up next run"
          
      - name: Upload jobs JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scraped-jobs
          path: |
            scraper/jobs.json
            scraper/jobs_existing.json
          retention-days: 7

  autoheal:
    runs-on: ubuntu-latest
    needs: scrape
    if: failure()
    permissions:
      issues: write

    steps:
      - name: Open (or update) an auto-heal issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create "auto-heal" --color "d73a4a" \
            --description "Automated failure of a scheduled workflow" 2>/dev/null || true

          # De-dup: one open auto-heal issue for this workflow at a time.
          EXISTING=$(gh issue list --label auto-heal --state open \
            --search "Auto-heal: scrape workflow in:title" \
            --json number --jq '.[0].number // empty')

          NOW=$(date -u +%FT%TZ)

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Another run failed: ${RUN_URL} (${NOW}, trigger: ${{ github.event_name }})."
            echo "Commented on existing issue #${EXISTING}"
            exit 0
          fi

          BODY="The **${{ github.workflow }}** workflow failed.

          - **Run:** ${RUN_URL}
          - **Commit:** \`${{ github.sha }}\`
          - **Trigger:** ${{ github.event_name }}
          - **When:** ${NOW}

          ## Likely causes
          - Careers-page selector broke — the scraper's canary aborts when all
            sources return 0 jobs (\`scraper/config/scraper.json\` selectors).
          - \`api.peviitor.ro\` / ANAF unreachable (retries with backoff are in
            place, but a long outage still fails the run).
          - Company marked inactive in ANAF (scraper deletes our jobs and stops).
          - A pre/post-scrape test suite failed.

          ## To fix
          1. Open the run logs above, find the failed step.
          2. Push a fix on \`main\`.
          3. Close this issue — the next scheduled run re-checks."

          gh issue create \
            --title "Auto-heal: scrape workflow failed $(date -u +%Y-%m-%d)" \
            --label auto-heal \
            --body "$BODY"