name: Tests

on:
  schedule:
    - cron: '0 7 * * *'
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (no deletions)'
        required: true
        default: 'true'

jobs:
  create-autoheal-issue:
    runs-on: ubuntu-latest
    if: failure()
    needs: [ensure-company-core, Automation-Tests, validate-jobs]
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v5
      - name: Create auto-heal issue
        run: |
          gh label create "auto-heal" --color "d73a4a" --description "Auto-heal issue for opencode" 2>/dev/null || true
          BODY="Workflow [**${{ github.workflow }}**](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) failed.

          ## Context
          - **Repository:** ${{ github.repository }}
          - **Run URL:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - **Branch:** ${{ github.ref }}
          - **Commit:** ${{ github.sha }}
          - **Trigger:** ${{ github.event_name }}

          ## Instructions for opencode
          1. Clone the repo and check out this branch.
          2. Investigate the run logs (linked above).
          3. Fix whatever caused the failure.
          4. Commit and push the fix.
          5. Close this issue — the next push will re-trigger the workflow."

          gh issue create \
            --title "Auto-heal: ${{ github.repository }} workflow failed $(date -u +%Y-%m-%d)" \
            --label "auto-heal" \
            --body "$BODY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-jobs:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: Automation-Tests
    
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          
      - name: Install dependencies
        run: npm install
        
      - name: Validate and remove expired jobs
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            echo "Schedule trigger — running LIVE mode..."
            node --no-deprecation tests/validate-company-jobs.js --delete
          elif [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            echo "Running in DRY RUN mode..."
            node --no-deprecation tests/validate-company-jobs.js --dry-run
          else
            echo "Running in LIVE mode (will delete expired jobs)..."
            node --no-deprecation tests/validate-company-jobs.js --delete
          fi

  ensure-company-core:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Ensure company exists in company core
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          # Zero-pad to 8 digits, exactly like padCif() in scraper/api.js --
          # otherwise this writes a SECOND, unpadded company record every push
          # (distinct from the one the real scraper maintains via
          # upsertCompany/padCif), which is exactly what caused a real
          # company to show up duplicated in peviitor's search dropdown.
          CIF=$(printf '%08d' "$(jq -r '.id' scraper/config/company.json)")

          # Hard guard: if CIF isn't exactly 8 digits after padding, abort
          # loudly here instead of writing a malformed/duplicate company-core
          # record. This is what should have caught the padding regression
          # that duplicated Aerostar/Turbomecanica/Cemacon in the search
          # dropdown -- a bad computed CIF must fail CI, not go through.
          if ! [[ "$CIF" =~ ^[0-9]{8}$ ]]; then
            echo "FAILED: computed CIF '${CIF}' is not exactly 8 digits (raw id: $(jq -r '.id' scraper/config/company.json)) -- aborting before any write."
            exit 1
          fi

          LEGAL_NAME=$(jq -r '.company' scraper/config/company.json)
          BRAND=$(jq -r '.brand' scraper/config/company.json)
          WEBSITE=$(jq -r '.website[0]' scraper/config/company.json)
          CAREER=$(jq -r '.career[0]' scraper/config/company.json)
          DEFAULT_LOC=$(jq -r '.location[0]' scraper/config/company.json)
          SCRAPER_FILE=$(jq -r '.scraperFile' scraper/config/company.json)

          jq -n \
            --arg id "$CIF" \
            --arg company "$LEGAL_NAME" \
            --arg brand "$BRAND" \
            --arg website "$WEBSITE" \
            --arg career "$CAREER" \
            --arg loc "$DEFAULT_LOC" \
            --arg today "$TODAY" \
            --arg scraperFile "$SCRAPER_FILE" \
            '{id:$id,company:$company,brand:$brand,status:"activ",location:[$loc],website:[$website],career:[$career],lastScraped:$today,scraperFile:$scraperFile}' \
            > company_data.json

          echo "Upserting ${BRAND} (CIF: ${CIF}) via peviitor API..."
          curl -s -X PUT \
            "https://api.peviitor.ro/v1/firme/company/add/" \
            -H "Content-Type: application/json" \
            --data-binary @company_data.json

          # The API is eventually consistent -- an immediate re-query right
          # after the PUT can still return 0 while the index catches up, so
          # poll briefly instead of failing on the very first check.
          FINAL=0
          for i in 1 2 3 4 5; do
            sleep 3
            FINAL=$(curl -s "https://api.peviitor.ro/v1/firme/company/?cif=${CIF}" | jq '.total')
            echo "${BRAND} count after upsert (attempt $i): $FINAL"
            if [ "$FINAL" -ge "1" ]; then
              break
            fi
          done

          if [ "$FINAL" -ge "1" ]; then
            echo "SUCCESS: ${BRAND} is in company core"
          else
            echo "FAILED: ${BRAND} still not in company core"
            exit 1
          fi

  Automation-Tests:
    runs-on: ubuntu-latest
    needs: ensure-company-core
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v5
        
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          
      - name: Sync with remote
        if: github.event_name != 'pull_request'
        run: git pull origin main --rebase -X theirs

      - name: Install dependencies
        run: npm install

      - name: Run Unit Tests
        run: |
          mkdir -p docs/test-results
          npm run test:unit
          sed -i 's|<title>Test Report</title>|<title>Pre-scrape: Unit Tests — AROBS TRANSILVANIA SOFTWARE S.A.</title>|;s|<h1 id="title">Test Report</h1>|<h1 id="title">Pre-scrape: Unit Tests — AROBS TRANSILVANIA SOFTWARE S.A.</h1>|' test-report.html
          cp test-report.html docs/test-results/pre-scrape-unit.html || true
          
      - name: Upload Unit Test Results
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: docs/test-results/pre-scrape-unit.html
          retention-days: 30

      - name: Run Integration Tests
        run: |
          mkdir -p docs/test-results
          npm run test:integration
          sed -i 's|<title>Test Report</title>|<title>Pre-scrape: Integration Tests — AROBS TRANSILVANIA SOFTWARE S.A.</title>|;s|<h1 id="title">Test Report</h1>|<h1 id="title">Pre-scrape: Integration Tests — AROBS TRANSILVANIA SOFTWARE S.A.</h1>|' test-report.html
          cp test-report.html docs/test-results/pre-scrape-integration.html || true
          
      - name: Upload Integration Test Results
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: docs/test-results/pre-scrape-integration.html
          retention-days: 30

      - name: Run E2E Tests
        run: |
          mkdir -p docs/test-results
          npm run test:e2e
          sed -i 's|<title>Test Report</title>|<title>Post-scrape: E2E Tests — AROBS TRANSILVANIA SOFTWARE S.A.</title>|;s|<h1 id="title">Test Report</h1>|<h1 id="title">Post-scrape: E2E Tests — AROBS TRANSILVANIA SOFTWARE S.A.</h1>|' test-report.html
          cp test-report.html docs/test-results/post-scrape.html || true
          
      - name: Upload E2E Test Results
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: docs/test-results/post-scrape.html
          retention-days: 30

      - name: Run Consistency Tests
        run: |
          mkdir -p docs/test-results
          npm run test:consistency
          sed -i 's|<title>Test Report</title>|<title>Post-scrape: Consistency Tests — AROBS TRANSILVANIA SOFTWARE S.A.</title>|;s|<h1 id="title">Test Report</h1>|<h1 id="title">Post-scrape: Consistency Tests — AROBS TRANSILVANIA SOFTWARE S.A.</h1>|' test-report.html
          cp test-report.html docs/test-results/post-scrape-consistency.html || true
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Consistency Test Results
        uses: actions/upload-artifact@v7
        with:
          name: consistency-test-results
          path: docs/test-results/post-scrape-consistency.html
          retention-days: 30

      - name: Push test results to docs/
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/test-results/
          git commit -m "[skip ci] Update test results" || echo "No changes to commit"
          git push || echo "Push failed (race condition) — will be picked up next run"